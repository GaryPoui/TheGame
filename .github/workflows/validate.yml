name: Validate game
on:
  pull_request:
  push:
    branches: ['codex/**', main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.17.1'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11.9'
      - run: npm ci
      - run: python scripts/skills.py verify
      - run: python scripts/verify-docs.py
      - run: python scripts/verify-math.py
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          EVIDENCE_DIR: test-results/evidence
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: game-validation
          path: test-results/
          retention-days: 14
